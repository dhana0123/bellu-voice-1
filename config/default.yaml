# Locked to Telugu while we iterate the duplex stack.
language: te
language_name: Telugu

sample_rate: 16000
event_loop_ms: 80
asr_interval_ms: 400
sta_interval_ms: 500
audio_window_s: 4.0
ring_buffer_s: 8.0

asr:
  model_id: bodhan-ai/indic-transcribe-core
  language: te
  device: cuda
  window_s: 3.0
  min_speech_ms: 250
  min_rms: 0.02

sta:
  repo_id: ASLP-lab/Easy-Turn
  easy_turn_root: third_party/Easy-Turn/Easy_Turn
  checkpoint: models/easy-turn/checkpoint.pt
  train_yaml: models/easy-turn/train.yaml
  qwen_path: models/Qwen2.5-0.5B-Instruct
  device: cuda
  window_s: 4.0
  task: "<TRANSCRIBE> <BACKCHANNEL> <COMPLETE>"
  prompt: "Please transcribe the audio, then append exactly one turn tag: <COMPLETE>, <INCOMPLETE>, <BACKCHANNEL>, or <WAIT>."

llm:
  model_id: sarvamai/OpenHathi-7B-Hi-v0.1-Base
  language: te
  device: auto
  max_new_tokens: 96
  temperature: 0.3
  repetition_penalty: 1.25
  enable_thinking: false
  min_decision_interval_ms: 0

tts:
  model_id: ai4bharat/indic-parler-tts
  language: te
  device: cuda
  speaker: Lalitha
  play_steps_s: 0.5
  sample_rate: 44100

playback:
  output_sample_rate: 16000

ui:
  host: 0.0.0.0
  port: 8998

gating:
  backchannel_threshold: 0.75
  interruption_threshold: 0.55
  complete_threshold: 0.80
  wait_threshold: 0.70
