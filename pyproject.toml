[project]
name = "bellu-voice"
version = "0.1.0"
description = "Moshi-UI duplex voice agent: DualTurn + ASR + Sarvam-30B + Parler TTS"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "torch",
    "torchaudio",
    "transformers>=4.57.0",
    "accelerate",
    "huggingface-hub>=0.24",
    "safetensors",
    "sphn",
    "soundfile",
    "faster-whisper",
    "sentencepiece",
]

[project.optional-dependencies]
tts = ["parler-tts"]
indic = ["nemo_toolkit[asr]"]

[project.scripts]
bellu-voice = "bellu_voice.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bellu_voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
